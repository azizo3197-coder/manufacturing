<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MNG222 Study Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@300;400;600;700;800&display=swap">
<style>
  /* Layout: fixed sidebar + one scrolling main column; each lecture has Summary and Quiz tabs. Dark-first. */
  :root {
    --bg: #0d0f14; --surface: #13161e; --surface2: #1a1e2a; --border: #262b3d;
    --text: #e4e8f5; --muted: #8e98b6; --dim: #5d6688; --code-bg: #0a0c12;
    --c1: #5b8cff; --c2: #36d6a0; --c3: #f0c040; --c4: #ff6b6b; --c5: #b46aff; --c6: #ff9f5a;
    --good: #36d6a0; --bad: #ff6b6b;
    --font: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --side-w: 248px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5fa; --surface: #ffffff; --surface2: #eceef7; --border: #d9dcea;
      --text: #161a2b; --muted: #545d7c; --dim: #8189a6; --code-bg: #eef0f8;
      --c1: #2d5bdb; --c2: #0c8f67; --c3: #9a6f00; --c4: #d13b3b; --c5: #8337d6; --c6: #c2601a;
      --good: #0c8f67; --bad: #d13b3b; color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5fa; --surface: #ffffff; --surface2: #eceef7; --border: #d9dcea;
    --text: #161a2b; --muted: #545d7c; --dim: #8189a6; --code-bg: #eef0f8;
    --c1: #2d5bdb; --c2: #0c8f67; --c3: #9a6f00; --c4: #d13b3b; --c5: #8337d6; --c6: #c2601a;
    --good: #0c8f67; --bad: #d13b3b; color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.7; }
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--c1); outline-offset: 2px; }

  /* Sidebar */
  .sidebar { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: 0; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; z-index: 150; padding: 0 0 24px; }
  .side-head { padding: 24px 20px 18px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
  .side-head h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--c1); }
  .side-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .nav-item { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 10px 20px; font-size: 13px; line-height: 1.45; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
  .nav-item .n { font-family: var(--mono); font-size: 11px; color: var(--dim); flex: none; }
  .nav-item:hover { color: var(--text); background: var(--surface2); }
  .nav-item.active { color: var(--a, var(--c1)); background: color-mix(in srgb, var(--a, var(--c1)) 10%, transparent); border-left-color: var(--a, var(--c1)); }
  .nav-item .best { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--good); flex: none; }
  .nav-sep { height: 1px; background: var(--border); margin: 10px 20px; }

  /* Main */
  .main { margin-left: var(--side-w); max-width: calc(1040px + var(--side-w)); padding: 48px 56px 64px; }
  .view { animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .head { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin-bottom: 12px; color: var(--a, var(--c1)); background: color-mix(in srgb, var(--a, var(--c1)) 15%, transparent); }
  .head h2 { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 800; line-height: 1.15; letter-spacing: -.02em; text-wrap: balance; }
  .head p { margin: 10px 0 0; color: var(--muted); font-size: 15px; font-weight: 300; max-width: 64ch; }

  /* Home */
  .home-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .home-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px; cursor: pointer; display: block; width: 100%; transition: border-color .2s, transform .2s, box-shadow .2s; }
  .home-card:hover { border-color: var(--a, var(--c1)); transform: translateY(-2px); box-shadow: 0 8px 28px color-mix(in srgb, var(--a, var(--c1)) 14%, transparent); }
  .home-card .num { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--a, var(--c1)); margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .home-card .num .best { font-family: var(--mono); letter-spacing: 0; color: var(--good); text-transform: none; }
  .home-card h3 { margin: 0 0 8px; font-size: 16px; }
  .home-card p { margin: 0; font-size: 13px; color: var(--muted); }
  .home-card.wide { grid-column: 1 / -1; }

  /* Lecture chrome */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; transition: color .15s, border-color .15s; }
  .btn:hover { color: var(--a, var(--c1)); border-color: var(--a, var(--c1)); }
  .btn:disabled { opacity: .3; pointer-events: none; }
  .btn.primary { background: var(--a, var(--c1)); border-color: var(--a, var(--c1)); color: var(--bg); }
  .btn.primary:hover { color: var(--bg); filter: brightness(1.1); }
  .arrows { display: flex; align-items: center; gap: 8px; }
  .counter { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .08em; }
  .tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; margin-bottom: 28px; }
  .tab { border: 0; background: none; padding: 7px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: color-mix(in srgb, var(--a, var(--c1)) 16%, transparent); color: var(--a, var(--c1)); }
  .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }

  /* Summary content */
  .lead { margin: 0 0 24px; padding: 16px 20px; border-radius: 8px; background: color-mix(in srgb, var(--a, var(--c1)) 8%, transparent); border: 1px solid color-mix(in srgb, var(--a, var(--c1)) 28%, transparent); font-size: 15px; }
  .topic { margin: 36px 0 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px 26px; margin-bottom: 20px; min-width: 0; }
  .card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .card h3::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--a, var(--c1)); flex: none; }
  .card p { margin: 8px 0; }
  .card ul { margin: 8px 0; padding-left: 20px; }
  .card li { margin-bottom: 6px; }
  .card strong, .box strong { font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
  .grid2 .card { margin-bottom: 0; }
  .tablewrap { overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 460px; }
  th { text-align: left; padding: 10px 14px; background: var(--surface2); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td:first-child { font-weight: 600; white-space: nowrap; }
  .box { border-radius: 8px; padding: 14px 18px; margin: 14px 0 20px; font-size: 14px; border: 1px solid; border-left-width: 3px; }
  .box.tip { background: color-mix(in srgb, var(--good) 8%, transparent); border-color: color-mix(in srgb, var(--good) 30%, transparent); border-left-color: var(--good); }
  .box.tip strong { color: var(--good); }
  .box.warn { background: color-mix(in srgb, var(--bad) 8%, transparent); border-color: color-mix(in srgb, var(--bad) 30%, transparent); border-left-color: var(--bad); }
  .box.warn strong { color: var(--bad); }
  .term { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; color: var(--a, var(--c1)); white-space: nowrap; }

  /* Quiz */
  .quiz { max-width: 760px; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .progress { height: 4px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin-bottom: 26px; }
  .progress i { display: block; height: 100%; background: var(--a, var(--c1)); transition: width .3s; }
  .qprompt { font-size: clamp(18px, 2.6vw, 22px); font-weight: 700; line-height: 1.4; margin: 0 0 22px; text-wrap: balance; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; cursor: pointer; font-size: 14.5px; line-height: 1.5; transition: border-color .15s, background .15s; }
  .opt .k { font-family: var(--mono); font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--surface2); color: var(--muted); flex: none; }
  .opt:hover:not(:disabled) { border-color: var(--a, var(--c1)); }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
  .opt.right .k { background: var(--good); color: var(--bg); }
  .opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
  .opt.wrong .k { background: var(--bad); color: var(--bg); }
  .opt.dim { opacity: .55; }
  .fb { margin-top: 18px; padding: 14px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
  .fb b { display: block; margin-bottom: 2px; }
  .fb.ok b { color: var(--good); }
  .fb.no b { color: var(--bad); }
  .qfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--dim); }
  .score { font-size: clamp(44px, 9vw, 72px); font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 10px 0 6px; color: var(--a, var(--c1)); font-variant-numeric: tabular-nums; }
  .review { margin-top: 28px; display: grid; gap: 12px; }
  .rv { border: 1px solid var(--border); border-left: 3px solid var(--bad); border-radius: 8px; background: var(--surface); padding: 14px 18px; font-size: 14px; }
  .rv p { margin: 0 0 6px; font-weight: 600; }
  .rv .you { color: var(--bad); }
  .rv .ans { color: var(--good); }
  .rv small { display: block; margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

  /* Mobile */
  .topbar { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); align-items: center; justify-content: space-between; }
  .topbar span { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--c1); }
  .burger { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 140; }
  .overlay.open { display: block; }
  @media (max-width: 820px) {
    .main { margin-left: 0; padding: calc(72px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
    .sidebar { transform: translateX(-100%); transition: transform .25s ease; padding-left: env(safe-area-inset-left, 0px); }
    .sidebar.open { transform: none; }
    .topbar { display: flex; }
    .home-grid, .grid2 { grid-template-columns: minmax(0, 1fr); }
    .card { padding: 18px 18px; }
    .btn.back { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } .progress i, .home-card, .sidebar { transition: none; } }
</style>

<div class="topbar"><span>MNG222 STUDY GUIDE</span><button class="burger" id="burger" aria-label="Open lecture menu">Menu</button></div>
<div class="overlay" id="overlay"></div>
<nav class="sidebar" id="sidebar" aria-label="Lectures"></nav>
<main class="main" id="main"></main>

<script>
(function () {
  /* ---------- Quiz question helper: Q(prompt, options, correctIndex, explanation) ---------- */
  function Q(p, o, c, e) { return { p: p, o: o, c: c, e: e }; }
  function ul(a) { return '<ul>' + a.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }
  function tbl(h, rows) {
    return '<div class="tablewrap"><table><thead><tr>' + h.map(function (x) { return '<th>' + x + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function card(t, body) { return '<div class="card"><h3>' + t + '</h3>' + body + '</div>'; }
  function pair(a, b) { return '<div class="grid2">' + a + b + '</div>'; }
  function topic(t) { return '<div class="topic">' + t + '</div>'; }
  function tip(t) { return '<div class="box tip"><strong>Exam point.</strong> ' + t + '</div>'; }
  function warn(t) { return '<div class="box warn"><strong>Watch out.</strong> ' + t + '</div>'; }
  function lead(t) { return '<p class="lead">' + t + '</p>'; }
  function T(t) { return '<span class="term">' + t + '</span>'; }

  var L = [];

  /* ---------------- Lecture 1 ---------------- */
  L.push({
    id: 'l1', color: 'var(--c1)', title: 'Introduction to Manufacturing',
    blurb: 'Definitions, industries, quantity and variety, materials, process families, production systems',
    sub: 'Manufacturing is a technical process that alters geometry, properties or appearance, and an economic one that adds value.',
    summary:
      lead('Materials, processes and systems are the three building blocks of manufacturing. Everything else in the course is one of them.') +
      topic('Why it matters and what it is') +
      pair(
        card('Why manufacturing matters', ul([
          '<strong>Technologically:</strong> every technological product must be made.',
          '<strong>Economically:</strong> it creates material wealth (about 20% of GNP in the US figures used). Services move wealth around but do not create it.',
          '<strong>Historically:</strong> cultures better at making things did better, from interchangeable parts and the assembly line to CNC automation.'])) +
        card('Two definitions', ul([
          '<strong>Technologic:</strong> applying physical and chemical processes to alter the geometry, properties or appearance of a starting material, including assembly.',
          '<strong>Economic:</strong> transforming materials into items of greater value by processing or assembly operations.',
          'From Latin <em>manus</em> (hand) + <em>factus</em> (make).']))
      ) +
      warn('Production is not the same as manufacturing. Production is broader and includes extraction and cultivation ("crude oil production"). In this course manufacturing means hardware.') +
      topic('Industries, quantity and variety') +
      pair(
        card('Industries and products', ul([
          '<strong>Primary:</strong> exploit natural resources. <strong>Secondary:</strong> convert them (manufacturing). <strong>Tertiary:</strong> services.',
          'Buyers: consumer goods, capital goods, and materials, components and supplies.',
          '<strong>Discrete items</strong> are counted one by one. <strong>Continuous products</strong> are measured by length, volume or mass.'])) +
        card('Quantity and variety', ul([
          'Low: 1 to 100 units per year. Medium: 100 to 10,000. High: 10,000 and up.',
          '<strong>Hard variety:</strong> products differ greatly, few common components. <strong>Soft variety:</strong> small differences, many common components.',
          'High variety and high quantity do not coexist. Flexible automation and cellular manufacturing push that limit outward.']))
      ) +
      card('Manufacturing capability has three limits', ul([
        'Technological processing capability (the processes available and the skills of the people).',
        'Physical size and weight of the product.',
        'Production capacity (the maximum rate a plant can achieve under assumed operating conditions).'])) +
      topic('Engineering materials') +
      tbl(['Family', 'What it is', 'Key traits'], [
        ['Metals', 'Usually alloys. Ferrous (iron-based: steel 0.02 to 2.1% C, cast iron 2 to 4% C) or nonferrous.', 'Ductile, strong, conductive. Can be cast, deformed and machined.'],
        ['Ceramics', 'Compounds of metallic and nonmetallic elements. Includes glasses.', 'Hard, brittle, heat-resistant, insulating. Shaped from powder or as glass.'],
        ['Polymers', 'Long molecules of repeating mers. Thermoplastics, thermosets, elastomers.', 'Low density and stiffness. Moulded to net shape.'],
        ['Composites', 'Nonhomogeneous mixtures of the other three.', 'Properties tailored by combination.']]) +
      pair(
        card('Three kinds of polymer', ul([
          '<strong>Thermoplastic:</strong> softens on heating, can be remelted.',
          '<strong>Thermoset:</strong> cures irreversibly, cannot be remelted.',
          '<strong>Elastomer:</strong> large elastic extension and recovery.'])) +
        card('Material narrows the process', ul([
          'Cast iron is brittle, so it can be cast and machined but not forged or deep drawn.',
          'Engineering ceramics have no plastic flow before fracture, so no forging, turning or welding.',
          'Thermoplastics remelt, so fusion welding of a load path is ruled out.']))
      ) +
      topic('Manufacturing processes') +
      tbl(['Shaping family', 'Starting state', 'Examples', 'Note'], [
        ['Solidification', 'Liquid', 'Casting (metals), moulding (plastics)', 'Complex shapes, but porosity and poorer finish'],
        ['Particulate processing', 'Powder', 'Press and sinter', 'Near-net shape, little waste'],
        ['Deformation', 'Ductile solid', 'Rolling, forging, extrusion, sheet metal', 'No material removed. Ductile materials only'],
        ['Material removal', 'Solid', 'Turning, milling, drilling, grinding', 'Most accurate, but wasteful']]) +
      pair(
        card('Other operations', ul([
          '<strong>Property-enhancing:</strong> heat treatment changes properties, not shape.',
          '<strong>Surface processing:</strong> cleaning, plating, painting, coating.',
          '<strong>Assembly:</strong> permanent joining (welding, brazing, soldering, adhesive) or mechanical fastening (threads, rivets, press and snap fits).'])) +
        card('Machines and tooling', ul([
          'Machine tools perform machining, and machine tools are used to make machine tools.',
          'Special tooling is part-specific: moulds, dies, jigs, fixtures.',
          'Tooling cost is spread over the run, so quantity governs process selection.']))
      ) +
      topic('Production systems') +
      tbl(['Quantity', 'System', 'Typical layout'], [
        ['Low (1 to 100)', 'Job shop', 'Fixed-position or process'],
        ['Medium (100 to 10,000)', 'Batch or cellular production', 'Process or cellular'],
        ['High (10,000 and up)', 'Quantity or flow-line mass production', 'Cellular or product']]) +
      pair(
        card('Four plant layouts', ul([
          '<strong>Fixed-position:</strong> product stays (ships, aircraft).',
          '<strong>Process:</strong> machines grouped by type.',
          '<strong>Cellular:</strong> cells making part families (group technology).',
          '<strong>Product:</strong> stations in product sequence, the flow line.'])) +
        card('Support systems and flows', ul([
          'Support systems: manufacturing engineering, production planning and control, quality control.',
          '<strong>Material flow</strong> runs through the facilities.',
          '<strong>Information flow</strong> runs through the support systems.',
          'The factory floor is where both meet.']))
      ),
    quiz: [
      Q('Which statement is the technologic definition of manufacturing?', ['Transforming materials into items of greater value', 'Applying physical and chemical processes to alter the geometry, properties or appearance of a starting material, including assembly', 'Extracting and cultivating natural resources', 'Moving wealth between sectors of the economy'], 1, 'The technologic view is about altering geometry, properties or appearance. The first option is the economic definition.'),
      Q('Why is "crude oil production" correct but "crude oil manufacturing" sounds wrong?', ['Production is the broader term and includes extraction, while manufacturing means altering a starting material', 'Oil is a continuous product, and continuous products cannot be produced', 'Manufacturing only applies to metals', 'Production only applies to services'], 0, 'Production covers extraction and cultivation as well as making. Manufacturing here means hardware.'),
      Q('Manufacturing is the principal activity of which category of industry?', ['Primary', 'Tertiary', 'Secondary', 'Service'], 2, 'Primary industries exploit natural resources, secondary industries convert them (manufacturing), tertiary industries provide services.'),
      Q('How are product variety and production quantity per product related in a plant?', ['Directly: more variety means more quantity', 'They are unrelated', 'Inversely: high variety usually means low quantity per product', 'Only related for continuous processes'], 2, 'High variety and high quantity do not coexist. Flexible automation and cellular manufacturing push that limit outward.'),
      Q('Which set lists the three limits of manufacturing capability?', ['Cost, quality and delivery', 'Technological processing capability, physical size and weight of product, production capacity', 'Materials, processes and systems', 'Quantity, variety and layout'], 1, 'Materials, processes and systems are the three building blocks of manufacturing, not the capability limits.'),
      Q('What distinguishes a thermosetting polymer from a thermoplastic?', ['It softens repeatedly on heating', 'It shows large elastic extension and recovery', 'It is always a composite', 'It cures irreversibly and cannot be remelted'], 3, 'Thermosets (phenolics, epoxies) cure once and stay rigid. Large elastic recovery describes elastomers.'),
      Q('Which shaping family changes shape by making a ductile solid flow, with no material removed?', ['Solidification', 'Deformation', 'Particulate processing', 'Material removal'], 1, 'Deformation (rolling, forging, extrusion, sheet metal) stresses a ductile solid beyond yield so it flows.'),

  /* ---------------- App state and helpers ---------------- */
  var main = document.getElementById('main');

  function store(get, k, v) {
    try { if (get) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  function best(id) { var v = store(true, 'mng222-best-' + id); return v ? v : null; }
  function saveBest(id, score, total) {
    var cur = best(id);
    var pct = score / total;
    if (!cur || pct > parseFloat(cur.split('/')[0]) / parseFloat(cur.split('/')[1])) store(false, 'mng222-best-' + id, score + '/' + total);
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function lecIndex(id) { for (var i = 0; i < L.length; i++) if (L[i].id === id) return i; return -1; }

  /* Build quiz question set with shuffled options, keeping track of the correct one */
  function prep(qs) {
    return qs.map(function (q) {
      var idx = shuffle(q.o.map(function (_, i) { return i; }));
      return { p: q.p, e: q.e, o: idx.map(function (i) { return q.o[i]; }), c: idx.indexOf(q.c) };
    });
  }
  function allQuestions() { var a = []; L.forEach(function (l) { l.quiz.forEach(function (q) { a.push(q); }); }); return a; }

  /* ---------------- Quiz engine ---------------- */
  function startQuiz(key, qs, partial) {
    quiz = { key: key, src: qs, qs: prep(qs), i: 0, score: 0, picked: null, missed: [], done: false, partial: !!partial };
    drawQuiz();
  }
  function drawQuiz() {
    var pane = document.getElementById('pane');
    if (!pane || !quiz) return;
    var q = quiz;
    if (q.done) { drawResult(pane); return; }
    var cur = q.qs[q.i];
    var answered = q.picked !== null;
    var h = '<div class="quiz"><div class="qmeta"><span>Question ' + (q.i + 1) + ' of ' + q.qs.length + '</span><span>Score ' + q.score + '</span></div><div class="progress"><i style="width:' + ((q.i + (answered ? 1 : 0)) / q.qs.length * 100) + '%"></i></div>';
    h += '<p class="qprompt">' + esc(cur.p) + '</p><div class="opts">';
    cur.o.forEach(function (o, i) {
      var cls = 'opt';
      if (answered) {
        if (i === cur.c) cls += ' right'; else if (i === q.picked) cls += ' wrong'; else cls += ' dim';
      }
      h += '<button class="' + cls + '" data-opt="' + i + '"' + (answered ? ' disabled' : '') + '><span class="k">' + LET[i] + '</span><span>' + esc(o) + '</span></button>';
    });
    h += '</div>';
    if (answered) {
      var ok = q.picked === cur.c;
      h += '<div class="fb ' + (ok ? 'ok' : 'no') + '" role="status"><b>' + (ok ? 'Correct.' : 'Not quite.') + '</b>' + esc(cur.e) + '</div>';
    }
    h += '<div class="qfoot"><span class="hint">' + (answered ? 'Press Enter for the next question' : 'Pick an answer, or press A to D') + '</span>' + (answered ? '<button class="btn primary" data-next="1">' + (q.i + 1 === q.qs.length ? 'See results' : 'Next question &rarr;') + '</button>' : '') + '</div></div>';
    pane.innerHTML = h;
    var nb = pane.querySelector('[data-next]'); if (nb) nb.focus({ preventScroll: true });
  }
  function pick(i) {
    if (!quiz || quiz.done || quiz.picked !== null) return;
    var cur = quiz.qs[quiz.i];
    quiz.picked = i;
    if (i === cur.c) quiz.score++; else quiz.missed.push({ q: cur, you: cur.o[i] });
    drawQuiz();
  }
  function nextQ() {
    if (!quiz || quiz.picked === null) return;
    if (quiz.i + 1 === quiz.qs.length) {
      quiz.done = true;
      if (quiz.key !== 'mixed' && !quiz.partial) saveBest(quiz.key, quiz.score, quiz.qs.length);
      buildSidebar(quiz.key);
    } else { quiz.i++; quiz.picked = null; }
    drawQuiz();
    if (quiz.done) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function drawResult(pane) {
    var q = quiz, n = q.qs.length, pct = Math.round(q.score / n * 100);
    var msg = pct === 100 ? 'Perfect score.' : pct >= 80 ? 'Strong result. Review the misses below.' : pct >= 50 ? 'Getting there. Re-read the summary and retry the missed ones.' : 'Go back to the summary, then try again.';
    var h = '<div class="quiz"><div class="qmeta"><span>Finished</span><span>' + n + ' questions</span></div><div class="progress"><i style="width:100%"></i></div><div class="score">' + q.score + ' / ' + n + '</div><p style="margin:0;color:var(--muted)">' + pct + '%. ' + msg + '</p>';
    h += '<div class="actions"><button class="btn primary" data-retry="all">Retry quiz</button>' + (q.missed.length ? '<button class="btn" data-retry="missed">Retry ' + q.missed.length + ' missed</button>' : '') + (q.key !== 'mixed' ? '<button class="btn" data-tab="summary">Back to summary</button>' : '<button class="btn" data-go="home">All lectures</button>') + '</div>';
    if (q.missed.length) {
      h += '<h3 style="margin:30px 0 0;font-size:15px">Missed questions</h3><div class="review">';
      q.missed.forEach(function (m) {
        h += '<div class="rv"><p>' + esc(m.q.p) + '</p><span class="you">Your answer: ' + esc(m.you) + '</span><br><span class="ans">Correct: ' + esc(m.q.o[m.q.c]) + '</span><small>' + esc(m.q.e) + '</small></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    pane.innerHTML = h;
  }

  /* ---------------- Routing ---------------- */
  function route() {
    var id = (location.hash || '').replace('#', '');
    var tabPart = null;
    if (/-quiz$/.test(id)) { id = id.replace(/-quiz$/, ''); tabPart = 'quiz'; }
    if (lecIndex(id) >= 0) {
      if (tabPart) tabState[id] = 'quiz';
      buildSidebar(id); renderLecture(id);
    } else if (id === 'mixed') { buildSidebar('mixed'); renderMixed(); }
    else { buildSidebar('home'); renderHome(); }
    closeMenu();
    window.scrollTo({ top: 0 });
  }
  function go(id) {
    if (id === undefined || id === '') return;
    var target = id === 'home' ? '' : id;
    if ((location.hash || '').replace('#', '') === target) { route(); return; }
    location.hash = target;
  }
  function closeMenu() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-go],[data-tab],[data-opt],[data-next],[data-retry]');
    if (!t) return;
    if (t.hasAttribute('data-go')) { go(t.getAttribute('data-go')); return; }
    if (t.hasAttribute('data-tab')) {
      var cur = (location.hash || '').replace('#', '').replace(/-quiz$/, '');
      if (lecIndex(cur) < 0) return;
      tabState[cur] = t.getAttribute('data-tab');
      document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tabState[cur])); });
      renderPane(cur);
      return;
    }
    if (t.hasAttribute('data-opt')) { pick(parseInt(t.getAttribute('data-opt'), 10)); return; }
    if (t.hasAttribute('data-next')) { nextQ(); return; }
    if (t.hasAttribute('data-retry')) {
      var which = t.getAttribute('data-retry');
      var src = which === 'missed' ? quiz.missed.map(function (m) { var o = m.q; return { p: o.p, o: o.o, c: o.c, e: o.e }; }) : quiz.src;
      startQuiz(quiz.key, which === 'missed' ? src : (quiz.key === 'mixed' ? shuffle(allQuestions()).slice(0, 20) : quiz.src), which === 'missed');
      window.scrollTo({ top: 0 });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (!quiz || quiz.done) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toUpperCase(), idx = 'ABCD'.indexOf(k);
    if (idx < 0 && '1234'.indexOf(k) >= 0 && k.length === 1) idx = parseInt(k, 10) - 1;
    if (idx >= 0 && idx < quiz.qs[quiz.i].o.length && quiz.picked === null) { e.preventDefault(); pick(idx); }
    else if (e.key === 'Enter' && quiz.picked !== null) { e.preventDefault(); nextQ(); }
  });
  document.getElementById('burger').addEventListener('click', function () { sidebar.classList.toggle('open'); overlay.classList.toggle('open'); });
  overlay.addEventListener('click', closeMenu);
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
